services:
  nginx:
    image: nginx:1.29.5-alpine
    container_name: nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app-dev
      - app-staging
      - app-prod

  app-dev:
    image: denisamp24/multi-env-node-app:dev
    container_name: app-dev
    environment:
      - APP_ENV=dev
      - PORT=3000

  app-staging:
    image: denisamp24/multi-env-node-app:staging
    container_name: app-staging
    environment:
      - APP_ENV=staging
      - PORT=3000

  app-prod:
    image: denisamp24/multi-env-node-app:prod
    container_name: app-prod
    environment:
      - APP_ENV=prod
      - PORT=3000

  prometheus:
    image: prom/prometheus
    container_name: prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana
    container_name: grafana
    ports:
      - "3003:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin