services:
  nginx:
    image: nginx:1.29.5-alpine
    container_name: nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app-dev
      - app-staging
      - app-prod

  app-dev:
    image: denisamp24/multi-env-node-app:dev
    container_name: app-dev
    environment:
      - APP_ENV=dev
      - PORT=3000

  app-staging:
    image: denisamp24/multi-env-node-app:staging
    container_name: app-staging
    environment:
      - APP_ENV=staging
      - PORT=3000

  app-prod:
    image: denisamp24/multi-env-node-app:prod
    container_name: app-prod
    environment:
      - APP_ENV=prod
      - PORT=3000
